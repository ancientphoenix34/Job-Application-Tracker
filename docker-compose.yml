services:
  ai-parser:
    build:
      context: ./services/ai-parser
    env_file: ./services/ai-parser/.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: .
    env_file: .env
    environment:
      - AI_SERVICE_URL=http://ai-parser:8000
    ports:
      - "3000:3000"
    depends_on:
      - ai-parser
    restart: unless-stopped
